name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "curve-integration"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"
      - "docker-compose-test.yml"
      - ".github/workflows/pull-request-build-lint-api.yml"
      - "scripts/tests/api-validation-workflow.test.mjs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.requested_reviewers != null
      )
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.x"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Install API Dependencies
        run: cd apps/api && pip install -r requirements.txt
      - name: Lint apps/api
        run: ruff check apps/api

  test-curve:
    name: Test Curve (${{ matrix.test-group }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        test-group: [core, manual-planning, scope-regression]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.requested_reviewers != null
      )
    steps:
      - uses: actions/checkout@v6

      - name: Prepare disposable Plane test environment
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env

      - name: Validate Curve contract integrity
        run: |
          node scripts/tests/api-validation-workflow.test.mjs
          node apps/api/plane/curve/contracts/check-integrity.mjs

      - name: Run Curve backend tests and migration-drift check
        run: |
          # Curve's protected-store tests use qualified local fixtures. They do
          # not consume the unrelated, unpinned MinIO service in the full Plane
          # suite. Start all Curve dependencies explicitly; keep every Curve test.
          docker compose -f docker-compose-test.yml up -d --wait test-db test-redis test-mq
          docker compose -f docker-compose-test.yml run --no-deps --rm --build \
            -e PYTHONPATH=/code:/code/plane/curve:/code/plane/curve/tests/manual_plan_v2:/code/plane/curve/tests/manual_plan_v2/host api-tests \
            sh -c 'python plane/curve/tests/run_ci_suite.py "${{ matrix.test-group }}" && python manage.py makemigrations --check --dry-run'

      - name: Clean disposable Plane test environment
        if: always()
        run: docker compose -f docker-compose-test.yml down -v --remove-orphans

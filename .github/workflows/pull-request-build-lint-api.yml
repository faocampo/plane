name: Build and lint API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "curve-integration"
    types:
      - "opened"
      - "synchronize"
      - "ready_for_review"
      - "review_requested"
      - "reopened"
    paths:
      - "apps/api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.requested_reviewers != null
      )
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine).
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      # Only the dev group (ruff) is needed to lint. --locked still fails the
      # job if uv.lock is out of date with pyproject.toml.
      - name: Install API Dependencies
        working-directory: apps/api
        run: uv sync --locked --only-group dev
      # No --fix: fixable violations must fail the job, not be rewritten on the runner.
      - name: Lint apps/api
        working-directory: apps/api
        run: uv run --no-sync ruff check .

  test-curve:
    name: Test Curve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.requested_reviewers != null
      )
    steps:
      - uses: actions/checkout@v6

      - name: Prepare disposable Plane test environment
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env

      - name: Validate Curve contract integrity
        run: node apps/api/plane/curve/contracts/check-integrity.mjs

      - name: Run Curve backend tests and migration-drift check
        run: |
          docker compose -f docker-compose-test.yml up -d --wait test-db test-redis test-mq
          docker compose -f docker-compose-test.yml run --no-deps --rm --build api-tests \
            sh -c 'pytest plane/curve/tests plane/tests/unit/settings/test_storage.py -q && python manage.py makemigrations --check --dry-run'

      - name: Clean disposable Plane test environment
        if: always()
        run: docker compose -f docker-compose-test.yml down -v --remove-orphans

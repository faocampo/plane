apiVersion: 1

prune: true

datasources:
  - name: Prometheus Local
    uid: prometheus-local
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    orgId: 1
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Prometheus

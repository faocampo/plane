openapi: 3.1.0
info:
  title: Curve API
  version: 1.1.0
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
  description: >-
    Workspace-scoped Curve control-plane API. Every request is authorized against
    Plane workspace membership and Curve object policy before object retrieval.
servers:
  - url: /api/v1
security:
  - planeSession: []
paths:
  /workspaces/{workspace_slug}/curve/operations:
    get:
      operationId: listCurveOperations
      summary: List operations visible to the current principal
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/OperationType'
      responses:
        '200':
          description: Operation page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/operations/{operation_id}:
    get:
      operationId: getCurveOperation
      summary: Read one operation
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Current operation state
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/operation-summary.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/operations/{operation_id}/cancel:
    post:
      operationId: cancelCurveOperation
      summary: Request cancellation of a cancellable operation
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation accepted or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/operation-summary.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/products:
    get:
      operationId: listCurveProducts
      summary: List Products visible to the current workspace member
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ProductState'
      responses:
        '200':
          description: Product page, including archived Products when requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCurveProduct
      summary: Create an active Product owned by the creating workspace administrator
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/product-create-request.schema.json'
      responses:
        '201':
          description: Product created or replayed idempotently
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/products/{product_id}:
    get:
      operationId: getCurveProduct
      summary: Read one active or archived Product
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Current Product state
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCurveProductMetadata
      summary: Update Product name, description, or timezone
      description: >-
        Product key, owner, and lifecycle are not metadata fields and are
        rejected in this request. A timezone change applies prospectively.
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/product-update-request.schema.json'
      responses:
        '200':
          description: Product metadata updated or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/products/{product_id}/owner:
    post:
      operationId: reassignCurveProductOwner
      summary: Reassign the one active human Product owner
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/product-reassign-owner-request.schema.json'
      responses:
        '200':
          description: Product owner reassigned or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/products/{product_id}/archive:
    post:
      operationId: archiveCurveProduct
      summary: Archive a Product with no non-terminal Initiative
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Product archived or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/products/{product_id}/restore:
    post:
      operationId: restoreCurveProduct
      summary: Restore an archived Product
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Product restored or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/product.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives:
    get:
      operationId: listCurveInitiatives
      summary: List Initiatives visible to the current workspace member
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/InitiativeState'
        - $ref: '#/components/parameters/InitiativeProductId'
      responses:
        '200':
          description: Initiative page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiativePage'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      operationId: createCurveInitiative
      summary: Create a draft Initiative with three human gate assignments
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/initiative-create-request.schema.json'
      responses:
        '201':
          description: Initiative created or replayed idempotently
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/initiative.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives/{initiative_id}:
    get:
      operationId: getCurveInitiative
      summary: Read one Initiative
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
      responses:
        '200':
          description: Current Initiative state
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/initiative.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateCurveInitiativeDraft
      summary: Update permitted draft Initiative fields
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/initiative-update-request.schema.json'
      responses:
        '200':
          description: Draft Initiative updated or replayed idempotently
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/initiative.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives/{initiative_id}/accept-refinement:
    post:
      operationId: acceptCurveInitiativeRefinement
      summary: Pin the manual-first workflow and begin alignment
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/InitiativeMutation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives/{initiative_id}/pause:
    post:
      operationId: pauseCurveInitiative
      summary: Pause a draft or aligning Initiative
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/InitiativeTransition'
      responses:
        '200':
          $ref: '#/components/responses/InitiativeMutation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives/{initiative_id}/resume:
    post:
      operationId: resumeCurveInitiative
      summary: Resume a paused Initiative to its reauthorized prior state
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/InitiativeTransition'
      responses:
        '200':
          $ref: '#/components/responses/InitiativeMutation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/initiatives/{initiative_id}/cancel:
    post:
      operationId: cancelCurveInitiative
      summary: Cancel a non-terminal Initiative
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/InitiativeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/InitiativeTransition'
      responses:
        '200':
          $ref: '#/components/responses/InitiativeMutation'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /workspaces/{workspace_slug}/curve/events:
    get:
      operationId: streamCurveEvents
      summary: Stream authorized workspace events with resume support
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          description: Resume cursor is outside the retained stream window
          content:
            application/problem+json:
              schema:
                $ref: '../schemas/common.schema.json#/$defs/ProblemDetails'
  /workspaces/{workspace_slug}/curve/foundation-probes:
    post:
      operationId: createCurveFoundationProbe
      summary: Start the synthetic local M0 proof workflow
      description: >-
        Available only when DEBUG and CURVE_FOUNDATION_PROBE_ENABLED are true.
        Production and staging deployments must return 404.
      x-curve-environments:
        - local
      parameters:
        - $ref: '#/components/parameters/WorkspaceSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requested_delay_ms:
                  type: integer
                  minimum: 0
                  maximum: 5000
      responses:
        '202':
          description: Probe accepted or replayed idempotently
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/operation-summary.schema.json'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    planeSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: Plane authenticated session; mutating requests also require Plane's CSRF protection.
  parameters:
    WorkspaceSlug:
      name: workspace_slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 80
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InitiativeId:
      name: initiative_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OperationType:
      name: operation_type
      in: query
      required: false
      description: Restrict results before pagination to one supported Operation type.
      schema:
        type: string
        enum:
          - FOUNDATION_PROBE
          - WORKFLOW_COMMAND
          - PROVIDER_RECONCILIATION
    ProductState:
      name: state
      in: query
      required: false
      description: Restrict results before pagination; omit to return active Products.
      schema:
        type: string
        enum:
          - ACTIVE
          - ARCHIVED
    InitiativeState:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum:
          - DRAFT
          - ALIGNING
          - PAUSED
          - CANCELLED
    InitiativeProductId:
      name: product_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
  schemas:
    OperationPage:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '../schemas/operation-summary.schema.json'
        next_cursor:
          type:
            - string
            - 'null'
    ProductPage:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '../schemas/product.schema.json'
        next_cursor:
          type:
            - string
            - 'null'
    InitiativePage:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '../schemas/initiative.schema.json'
        next_cursor:
          type:
            - string
            - 'null'
  requestBodies:
    InitiativeTransition:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/initiative-transition-request.schema.json'
  responses:
    InitiativeMutation:
      description: Initiative mutated or replayed idempotently
      headers:
        ETag:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '../schemas/initiative.schema.json'
    Problem:
      description: Curve Problem Details response
      content:
        application/problem+json:
          schema:
            $ref: '../schemas/common.schema.json#/$defs/ProblemDetails'
